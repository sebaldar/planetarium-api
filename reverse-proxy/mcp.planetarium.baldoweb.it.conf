# vhost nginx per mcp.planetarium.baldoweb.it — VM proxy pubblica.
# Da copiare nella cartella conf.d (o equivalente) del docker-compose di
# nginx su quella VM, NON su dedalus. Vedi reverse-proxy/README.md.
#
# Certificato condiviso con www.baldoweb.it (--cert-name www.baldoweb.it
# --expand): stesso fullchain/privkey di tutti gli altri vhost su quel
# cert-name, questo file non ne emette uno suo.

limit_req_zone $binary_remote_addr zone=planetarium_mcp_rl:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.planetarium.baldoweb.it;

    # Serve al rinnovo certbot (webroot): NON reindirizzare questo path.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.planetarium.baldoweb.it;

    ssl_certificate     /etc/letsencrypt/live/www.baldoweb.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.baldoweb.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1m;

    location / {
        # Segreto FISSO iniettato da nginx verso planetarium-mcp, non
        # legato a ciò che manda il client esterno — chiave DIVERSA da
        # quella verso planetarium-api (confini di fiducia separati).
        # Vedi README del repo planetarium-api, sezione "Deploy: nginx +
        # WireGuard". /etc/nginx/secrets/planetarium.conf: permessi 600,
        # root:root, MAI in git. Vedi reverse-proxy/secrets.conf.example.
        include /etc/nginx/secrets/planetarium.conf;

        proxy_pass http://10.10.0.3:8485/;
        proxy_set_header X-API-Key $planetarium_mcp_key;   # fissa, non dal client

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP tiene la connessione aperta per lo stream SSE
        # (GET) e usa un header custom (Mcp-Session-Id): niente di
        # esotico, ma niente buffering/timeout aggressivi da reverse
        # proxy generico.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;

        limit_req zone=planetarium_mcp_rl burst=20 nodelay;
    }
}
