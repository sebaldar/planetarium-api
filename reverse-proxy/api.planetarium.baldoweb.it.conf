# vhost nginx per api.planetarium.baldoweb.it — VM proxy pubblica.
# Da copiare nella cartella conf.d (o equivalente) del docker-compose di
# nginx su quella VM, NON su dedalus. Vedi reverse-proxy/README.md.
#
# Certificato condiviso con www.baldoweb.it (--cert-name www.baldoweb.it
# --expand): stesso fullchain/privkey di tutti gli altri vhost su quel
# cert-name, questo file non ne emette uno suo.

limit_req_zone $binary_remote_addr zone=planetarium_rl:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.planetarium.baldoweb.it;

    # Serve al rinnovo certbot (webroot): NON reindirizzare questo path.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.planetarium.baldoweb.it;

    ssl_certificate     /etc/letsencrypt/live/www.baldoweb.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.baldoweb.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1m;

    location / {
        # Segreto FISSO iniettato da nginx verso planetarium-api, non
        # legato a ciò che manda il client esterno — vedi README del
        # repo planetarium-api, sezione "Deploy: nginx + WireGuard".
        # /etc/nginx/secrets/planetarium.conf: permessi 600, root:root,
        # MAI in git. Vedi reverse-proxy/secrets.conf.example.
        include /etc/nginx/secrets/planetarium.conf;

        proxy_pass http://10.10.0.3:8484/;
        proxy_set_header X-API-Key $planetarium_api_key;   # fissa, non dal client

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=planetarium_rl burst=20 nodelay;
    }
}
